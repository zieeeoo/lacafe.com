<!--
  LaCafe Member - versi satu file (tanpa server).
  Data tersimpan di browser perangkat masing-masing, tidak tersinkron antar HP/komputer.
  Untuk sistem member sungguhan (customer & admin berbagi data, aman), jalankan server.js
  dari lacafe-member.zip di hosting (lihat README.md).
-->
<style>
/* =====================================================================
   LaCafe Member — design tokens & komponen
   Warna/radius/font diisi dari pengaturan Tampilan (core.js → applyTheme)
   ===================================================================== */
:root {
  --primary: #1E2A5A; --accent: #E0A43A; --bg: #F4F5F9; --surface: #FFFFFF; --text: #161A2B;
  --on-primary: #fff; --on-accent: #14161F;
  --r-sm: 8px; --r-md: 14px; --r-lg: 20px;
  --font: 'Plus Jakarta Sans', system-ui, sans-serif; --font-display: var(--font);
  --muted: color-mix(in srgb, var(--text) 58%, var(--bg));
  --faint: color-mix(in srgb, var(--text) 38%, var(--bg));
  --line: color-mix(in srgb, var(--text) 10%, transparent);
  --line-strong: color-mix(in srgb, var(--text) 18%, transparent);
  --primary-soft: color-mix(in srgb, var(--primary) 9%, var(--surface));
  --accent-soft: color-mix(in srgb, var(--accent) 16%, var(--surface));
  --sunken: color-mix(in srgb, var(--text) 4%, var(--bg));
  --ok: #1F8A5B; --ok-soft: color-mix(in srgb, #1F8A5B 12%, var(--surface));
  --warn: #B7791F; --warn-soft: color-mix(in srgb, #B7791F 14%, var(--surface));
  --danger: #C2412D; --danger-soft: color-mix(in srgb, #C2412D 11%, var(--surface));
  --shadow-1: 0 1px 2px color-mix(in srgb, var(--text) 8%, transparent);
  --shadow-2: 0 12px 32px -12px color-mix(in srgb, var(--primary) 35%, transparent);
  --ease: cubic-bezier(.2, .8, .2, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); color: var(--text); background: var(--bg); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body.no-scroll { overflow: hidden; }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; line-height: 1.2; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
img { max-width: 100%; display: block; }
.ic { flex: none; }
.num, .tnum { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2.5px solid color-mix(in srgb, var(--primary) 70%, var(--accent)); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.hide { display: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- Tombol ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: var(--r-md); font-weight: 650; font-size: 15px; transition: background .15s, transform .1s, box-shadow .15s; white-space: nowrap; border: 1px solid transparent; text-decoration: none; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover:not(:disabled) { background: color-mix(in srgb, var(--primary) 88%, var(--text)); }
.btn-accent { background: var(--accent); color: var(--on-accent); }
.btn-ghost { background: transparent; border-color: var(--line-strong); }
.btn-ghost:hover { background: var(--sunken); }
.btn-soft { background: var(--primary-soft); color: var(--primary); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger-ghost { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
.btn-sm { min-height: 34px; padding: 0 12px; font-size: 13.5px; border-radius: var(--r-sm); }
.btn-block { width: 100%; }
.btn.is-busy { position: relative; color: transparent !important; }
.btn.is-busy::after { content: ''; position: absolute; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--on-primary); border-right-color: transparent; animation: spin .7s linear infinite; }
.btn-ghost.is-busy::after, .btn-soft.is-busy::after { border-color: var(--text); border-right-color: transparent; }
@keyframes spin { to { transform: rotate(360deg); } }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; color: inherit; transition: background .15s; }
.icon-btn:hover { background: var(--sunken); }
.link { color: var(--primary); font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 2px; }
.link:hover { text-decoration: underline; }

/* ---------- Form ---------- */
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--muted); }
.field small { color: var(--faint); font-size: 12.5px; }
input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=range]), select, textarea {
  width: 100%; min-height: 46px; padding: 10px 14px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface); outline: none; transition: border-color .15s, box-shadow .15s;
}
textarea { min-height: 84px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 16%, transparent); }
.input-icon { position: relative; }
.input-icon > .ic { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.input-icon > input { padding-left: 42px !important; }
.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 48px !important; }
.pw-wrap .icon-btn { position: absolute; right: 3px; top: 3px; color: var(--muted); }
.row { display: flex; gap: 12px; align-items: center; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.spacer { flex: 1; }
.check { display: flex; gap: 10px; align-items: center; cursor: pointer; font-weight: 500; }
.switch { position: relative; width: 44px; height: 26px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; position: absolute; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--line-strong); transition: background .2s; }
.switch i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s var(--ease); }
.switch input:checked + i { background: var(--primary); }
.switch input:checked + i::after { transform: translateX(18px); }
.switch input:focus-visible + i { outline: 2.5px solid var(--primary); outline-offset: 2px; }
.seg { display: inline-flex; background: var(--sunken); border-radius: var(--r-sm); padding: 3px; gap: 2px; }
.seg button { padding: 7px 14px; border-radius: calc(var(--r-sm) - 2px); font-weight: 600; font-size: 13.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed=true] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-1); }

/* ---------- Badge ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 650; padding: 3px 9px; border-radius: 99px; background: var(--sunken); color: var(--muted); white-space: nowrap; }
.badge-dot::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge-ok { background: var(--ok-soft); color: var(--ok); }
.badge-warn { background: var(--warn-soft); color: var(--warn); }
.badge-danger { background: var(--danger-soft); color: var(--danger); }
.badge-primary { background: var(--primary-soft); color: var(--primary); }
.tier-chip { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12.5px; padding: 3px 10px 3px 4px; border-radius: 99px; background: color-mix(in srgb, var(--tc) 16%, var(--surface)); color: color-mix(in srgb, var(--tc) 70%, var(--text)); }
.tier-chip i { width: 16px; height: 16px; border-radius: 50%; background: var(--tc); box-shadow: inset 0 0 0 2px color-mix(in srgb, #fff 45%, transparent); }

/* ---------- Toast ---------- */
#toasts { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); display: grid; gap: 8px; z-index: 300; width: min(92vw, 420px); pointer-events: none; }
.toast { background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: var(--r-md); font-weight: 600; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.2); animation: toastIn .25s var(--ease); transition: opacity .3s, transform .3s; }
.toast-error { background: var(--danger); color: #fff; }
.toast-ok { background: var(--ok); color: #fff; }
.toast.out { opacity: 0; transform: translateY(8px); }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } }

/* ---------- Sheet / dialog ---------- */
.sheet-backdrop { position: fixed; inset: 0; z-index: 200; background: color-mix(in srgb, #0B0D14 48%, transparent); display: flex; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity .2s; }
.sheet-backdrop.in { opacity: 1; }
.sheet { position: relative; background: var(--surface); width: 100%; max-width: 520px; max-height: 92dvh; display: flex; flex-direction: column; border-radius: var(--r-lg) var(--r-lg) 0 0; transform: translateY(24px); transition: transform .25s var(--ease); outline: none; }
.sheet-backdrop.in .sheet { transform: none; }
.sheet-wide { max-width: 760px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 12px 8px 22px; }
.sheet-head h2 { font-size: 18px; }
.sheet-x { position: absolute; right: 10px; top: 10px; z-index: 2; background: color-mix(in srgb, var(--surface) 85%, transparent); }
.sheet-body { padding: 8px 22px 22px; overflow-y: auto; overscroll-behavior: contain; }
.sheet-body::before { content: ''; }
@media (min-width: 720px) {
  .sheet-backdrop { align-items: center; padding: 24px; }
  .sheet { border-radius: var(--r-lg); max-height: 88vh; }
  .sheet-drawer-wrap { justify-content: flex-end; padding: 0; }
}
.dialog-msg { margin-bottom: 18px; color: var(--muted); }
.dialog-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }

/* ---------- Umum ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
.pad { padding: 18px; }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty .ic { width: 40px; height: 40px; color: var(--faint); margin: 0 auto 10px; }
.empty h4 { color: var(--text); margin-bottom: 4px; font-size: 16px; }
.skeleton { background: linear-gradient(90deg, var(--sunken), color-mix(in srgb, var(--sunken) 50%, var(--surface)), var(--sunken)); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: var(--r-sm); }
@keyframes shimmer { to { background-position: -200% 0; } }
.divider { height: 1px; background: var(--line); margin: 16px 0; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; }
.kv > span:first-child { color: var(--muted); }
.kv.total { font-weight: 800; font-size: 17px; border-top: 1px dashed var(--line-strong); margin-top: 6px; padding-top: 12px; }
.logo { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 11px; background: var(--primary); color: var(--on-primary); font-weight: 800; font-size: 14px; letter-spacing: -0.02em; overflow: hidden; flex: none; }
.logo img { width: 100%; height: 100%; object-fit: cover; }
.art { width: 100%; height: 100%; object-fit: cover; display: block; }

/* =====================================================================
   CUSTOMER APP
   ===================================================================== */
.c-shell { min-height: 100dvh; background: color-mix(in srgb, var(--primary) 7%, var(--bg)); }
.c-app { position: relative; max-width: 460px; margin: 0 auto; min-height: 100dvh; background: var(--bg); padding-bottom: 96px; }
@media (min-width: 720px) { .c-app { box-shadow: 0 0 0 1px var(--line), 0 30px 80px -40px color-mix(in srgb, var(--primary) 40%, transparent); } }
.c-top { display: flex; align-items: center; gap: 10px; padding: 18px 18px 6px; }
.c-top .brand { font-weight: 800; font-size: 17px; letter-spacing: -0.02em; }
.c-top .hello { font-size: 13px; color: var(--muted); }
.c-section { padding: 0 18px; margin-top: 26px; }
.c-section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.c-section-head h3 { font-size: 17px; font-weight: 750; }
.announce { margin: 10px 18px 0; padding: 10px 14px; border-radius: var(--r-sm); background: var(--accent-soft); color: color-mix(in srgb, var(--accent) 45%, var(--text)); font-size: 13.5px; font-weight: 600; display: flex; gap: 8px; align-items: center; }

/* Kartu member: elemen utama. Material kartu berubah sesuai level. */
.mcard { --mc: var(--primary); --mc-ink: var(--on-primary); position: relative; overflow: hidden; margin: 14px 18px 0; padding: 20px 20px 18px; border-radius: var(--r-lg); color: var(--mc-ink); isolation: isolate;
  background: radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--mc) 55%, #fff) 0%, var(--mc) 45%, color-mix(in srgb, var(--mc) 78%, #000) 100%); box-shadow: var(--shadow-2); }
.mcard.metal::before { content: ''; position: absolute; inset: 0; z-index: -1; opacity: .5; background: repeating-linear-gradient(100deg, transparent 0 3px, rgba(255,255,255,.07) 3px 4px), linear-gradient(115deg, transparent 30%, rgba(255,255,255,.45) 48%, transparent 62%); }
.mcard .rings { position: absolute; right: -70px; top: -70px; width: 240px; height: 240px; z-index: -1; opacity: .22; }
.mcard-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mcard-tier { display: inline-flex; align-items: center; gap: 7px; font-weight: 750; font-size: 13px; padding: 5px 11px; border-radius: 99px; background: color-mix(in srgb, var(--mc-ink) 14%, transparent); }
.mcard-code { font-size: 12.5px; opacity: .8; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.mcard-points { margin-top: 18px; display: flex; align-items: flex-end; gap: 8px; }
.mcard-points b { font-size: 46px; font-weight: 800; line-height: .95; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; }
.mcard-points span { font-size: 14px; font-weight: 600; opacity: .8; padding-bottom: 5px; }
.mcard-name { font-size: 13.5px; opacity: .85; margin-top: 4px; }
.mcard-progress { margin-top: 18px; }
.mcard-track { position: relative; height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--mc-ink) 18%, transparent); overflow: hidden; }
.mcard-track i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 80%, #fff), var(--accent)); transition: width .9s var(--ease); }
.mcard.metal .mcard-track i { background: linear-gradient(90deg, color-mix(in srgb, var(--mc-ink) 70%, transparent), var(--mc-ink)); }
.mcard-next { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 12.5px; font-weight: 600; opacity: .9; }
.mcard-actions { display: flex; gap: 8px; margin-top: 16px; }
.mcard-actions button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; border-radius: var(--r-sm); font-weight: 700; font-size: 13.5px; background: color-mix(in srgb, var(--mc-ink) 14%, transparent); color: inherit; }
.mcard-actions button:hover { background: color-mix(in srgb, var(--mc-ink) 22%, transparent); }
.mcard-guest b { font-size: 24px; letter-spacing: -0.02em; line-height: 1.2; display: block; margin: 14px 0 6px; }

.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 18px; margin-top: 18px; }
.quick button { display: grid; justify-items: center; gap: 7px; padding: 12px 4px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; font-weight: 650; position: relative; }
.quick button .qi { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--primary-soft); color: var(--primary); }
.quick .dot { position: absolute; top: 8px; right: 14px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 800; display: grid; place-items: center; }

.hscroll { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 18px; padding: 2px 18px 6px; margin: 0 -18px; scrollbar-width: none; }
.hscroll::after { content: ''; flex: 0 0 6px; }
.hscroll::-webkit-scrollbar { display: none; }
.hscroll > * { scroll-snap-align: start; flex: none; }
.banner { position: relative; width: 84%; min-height: 128px; border-radius: var(--r-md); padding: 18px; color: #fff; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; background: var(--bc); }
.banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
.banner.has-img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,.6), transparent 70%); }
.banner > div { position: relative; z-index: 1; }
.banner h4 { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
.banner p { font-size: 13px; opacity: .88; margin-top: 3px; }
.banner .ring-deco { position: absolute; right: -30px; bottom: -40px; width: 150px; height: 150px; opacity: .18; }

.pcard { width: 148px; text-align: left; }
.pcard .thumb { aspect-ratio: 1; border-radius: var(--r-md); overflow: hidden; position: relative; }
.pcard .thumb .add { position: absolute; right: 8px; bottom: 8px; }
.pcard h5 { font-size: 14px; font-weight: 650; margin: 8px 0 2px; line-height: 1.3; }
.pcard .price { font-weight: 750; font-size: 14px; }
.add-btn { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: var(--on-primary); box-shadow: 0 4px 10px -3px color-mix(in srgb, var(--primary) 60%, transparent); flex: none; }
.add-btn:disabled { background: var(--line-strong); box-shadow: none; }
.soldout { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--surface) 55%, transparent); font-weight: 800; font-size: 13px; color: var(--text); }

.cat-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.cat-tiles button { display: grid; gap: 6px; justify-items: center; font-size: 12.5px; font-weight: 650; }
.cat-tiles .ct { width: 100%; aspect-ratio: 1; border-radius: var(--r-md); overflow: hidden; }

.rw-mini { width: 220px; align-content: start; padding: 14px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); display: grid; gap: 8px; text-align: left; }
.rw-mini .pts { display: inline-flex; align-items: center; gap: 5px; font-weight: 800; color: color-mix(in srgb, var(--accent) 55%, var(--text)); font-size: 14px; }
.rw-mini h5 { font-size: 14.5px; font-weight: 700; }

/* Halaman menu */
.c-pagehead { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); padding: 16px 18px 10px; }
.c-pagehead h1 { font-size: 22px; font-weight: 800; margin-bottom: 12px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 12px -18px 0; padding: 0 18px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 8px 14px; border-radius: 99px; font-weight: 650; font-size: 13.5px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.chip[aria-pressed=true] { background: var(--text); border-color: var(--text); color: var(--bg); }
.m-cat { padding: 6px 18px 0; scroll-margin-top: 150px; }
.m-cat > h3 { font-size: 15px; font-weight: 750; color: var(--muted); margin: 18px 0 8px; }
.m-list .m-item { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.m-list .m-item .thumb { width: 76px; height: 76px; border-radius: var(--r-sm); overflow: hidden; flex: none; position: relative; }
.m-item .info { flex: 1; min-width: 0; }
.m-item h4 { font-size: 15px; font-weight: 650; font-family: var(--font); }
.m-item .desc { font-size: 13px; color: var(--muted); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.m-item .price { font-weight: 750; margin-top: 6px; font-size: 14.5px; }
.m-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.m-grid .m-item { display: grid; gap: 0; text-align: left; background: var(--surface); border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--line); }
.m-grid .m-item .thumb { aspect-ratio: 1; position: relative; }
.m-grid .m-item .info { padding: 10px 12px 12px; }
.m-grid .m-item .row { justify-content: space-between; margin-top: 6px; }
.m-grid .m-item .price { margin: 0; }
.m-large { display: grid; gap: 16px; }
.m-large .m-item { display: grid; text-align: left; background: var(--surface); border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--line); }
.m-large .m-item .thumb { aspect-ratio: 16/9; position: relative; }
.m-large .m-item .info { padding: 14px 16px 16px; }
.m-large .m-item .row { justify-content: space-between; margin-top: 8px; }
.temp-tag { font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 99px; margin-left: 6px; vertical-align: 2px; }
.temp-hot { background: #FBE6DC; color: #A2401F; }
.temp-cold { background: #DFEBFA; color: #2A5C9A; }

/* Detail item & keranjang */
.item-hero { margin: -8px -22px 16px; aspect-ratio: 16/10; overflow: hidden; }
.qty { display: inline-flex; align-items: center; gap: 4px; background: var(--sunken); border-radius: 99px; padding: 3px; }
.qty button { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow-1); }
.qty b { min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; }
.cart-line { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
.cart-line .thumb { width: 54px; height: 54px; border-radius: var(--r-sm); overflow: hidden; flex: none; }
.cart-line .info { flex: 1; min-width: 0; }
.cart-line h5 { font-size: 14.5px; font-weight: 650; }
.pay-opts { display: grid; gap: 8px; }
.pay-opt { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); cursor: pointer; font-weight: 600; }
.pay-opt:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); }
.pay-opt input { accent-color: var(--primary); width: 18px; height: 18px; }

.cartbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 82px; width: min(100% - 24px, 436px); z-index: 40; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 18px; border-radius: var(--r-md); background: var(--primary); color: var(--on-primary); box-shadow: 0 14px 30px -12px color-mix(in srgb, var(--primary) 70%, transparent); animation: toastIn .25s var(--ease); }
.cartbar .cnt { font-size: 12.5px; opacity: .8; }
.cartbar b { font-size: 16px; }
.cartbar .btn { background: var(--accent); color: var(--on-accent); min-height: 40px; }

/* Navigasi bawah */
.bnav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 460px; z-index: 50; display: grid; grid-template-columns: repeat(5, 1fr); background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 6px 4px calc(8px + env(safe-area-inset-bottom)); }
.bnav a { display: grid; justify-items: center; gap: 3px; padding: 6px 0; font-size: 11.5px; font-weight: 650; color: var(--faint); text-decoration: none; position: relative; }
.bnav a[aria-current=page] { color: var(--primary); }
.bnav a[aria-current=page]::before { content: ''; position: absolute; top: -7px; width: 22px; height: 3px; border-radius: 0 0 3px 3px; background: var(--primary); }
.bnav .dot { position: absolute; top: 2px; left: calc(50% + 6px); width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface); }

/* Rewards */
.pts-hero { margin: 0 18px; padding: 18px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); display: flex; align-items: center; gap: 14px; }
.pts-hero .coin { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: color-mix(in srgb, var(--accent) 55%, var(--text)); }
.pts-hero b { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.rw-list { display: grid; gap: 12px; }
.rw { display: flex; gap: 14px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); align-items: center; }
.rw .thumb { width: 64px; height: 64px; border-radius: var(--r-sm); overflow: hidden; flex: none; display: grid; place-items: center; background: var(--accent-soft); color: color-mix(in srgb, var(--accent) 55%, var(--text)); }
.rw .info { flex: 1; min-width: 0; }
.rw h4 { font-size: 15px; font-family: var(--font); font-weight: 700; }
.rw .meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.rw .cost { font-weight: 800; font-size: 14px; color: color-mix(in srgb, var(--accent) 50%, var(--text)); margin-top: 6px; display: inline-flex; gap: 4px; align-items: center; }
.rw.locked { opacity: .62; }
.tabs { display: flex; gap: 4px; padding: 0 18px; border-bottom: 1px solid var(--line); margin-top: 18px; }
.tabs button { padding: 10px 12px; font-weight: 700; font-size: 14px; color: var(--faint); border-bottom: 2.5px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected=true] { color: var(--text); border-color: var(--primary); }
.voucher { display: grid; grid-template-columns: 1fr auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.voucher .vl { padding: 14px 16px; }
.voucher .vr { display: grid; place-items: center; padding: 0 18px; border-left: 2px dashed var(--line-strong); background: var(--primary-soft); font-weight: 800; font-size: 13px; letter-spacing: .06em; color: var(--primary); font-variant-numeric: tabular-nums; }
.voucher.used { opacity: .55; }

/* Pesanan */
.order-card { padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
.order-card + .order-card { margin-top: 12px; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 14px 0 6px; }
.steps div { height: 5px; border-radius: 99px; background: var(--line); }
.steps div.on { background: var(--primary); }
.steps-label { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; font-size: 11.5px; color: var(--faint); font-weight: 600; }
.steps-label .on { color: var(--text); }
.queue { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.trx-row { display: flex; gap: 12px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }
.trx-row .ti { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--sunken); color: var(--muted); flex: none; }
.trx-row .info { flex: 1; min-width: 0; }
.trx-row h5 { font-size: 14.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trx-row .amt { text-align: right; font-weight: 750; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.plus { color: var(--ok); }
.minus { color: var(--danger); }

/* Akun */
.acct-head { display: flex; gap: 14px; align-items: center; padding: 22px 18px 4px; }
.avatar { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: var(--on-primary); font-weight: 800; font-size: 20px; flex: none; }
.menu-list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.menu-list button, .menu-list a { display: flex; width: 100%; gap: 12px; align-items: center; padding: 15px 16px; text-align: left; font-weight: 600; text-decoration: none; }
.menu-list > * + * { border-top: 1px solid var(--line); }
.menu-list .ic:last-child { margin-left: auto; color: var(--faint); }
.ladder { display: grid; gap: 10px; }
.ladder-step { display: flex; gap: 12px; padding: 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); }
.ladder-step.current { border-color: var(--tc); box-shadow: inset 4px 0 0 var(--tc); }
.ladder-step .medal { width: 38px; height: 38px; border-radius: 50%; flex: none; background: radial-gradient(circle at 30% 30%, color-mix(in srgb, var(--tc) 50%, #fff), var(--tc)); }
.ladder-step ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); }

/* Kode member (pass) */
.pass { text-align: center; padding: 8px 0 6px; }
.pass .digits { font-size: 44px; font-weight: 800; letter-spacing: .12em; font-variant-numeric: tabular-nums; margin: 6px 0 4px; }
.pass .ring { width: 64px; height: 64px; margin: 10px auto 0; }
.pass .member { display: inline-block; margin-top: 14px; padding: 8px 16px; border-radius: 99px; background: var(--sunken); font-weight: 700; letter-spacing: .06em; }

/* Auth */
.auth { min-height: 100dvh; display: grid; align-content: start; padding: 0 0 40px; }
.auth-hero { position: relative; overflow: hidden; padding: 40px 24px 70px; background: var(--primary); color: var(--on-primary); }
.auth-hero .rings { position: absolute; right: -90px; top: -60px; width: 300px; height: 300px; opacity: .16; }
.auth-hero h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; margin-top: 28px; max-width: 15ch; }
.auth-hero p { opacity: .82; margin-top: 8px; max-width: 34ch; }
.auth-hero .logo { background: var(--on-primary); color: var(--primary); }
.auth-card { margin: -42px 16px 0; position: relative; background: var(--surface); border-radius: var(--r-lg); padding: 22px 20px; box-shadow: 0 20px 40px -20px color-mix(in srgb, var(--primary) 40%, transparent); }
.auth-card .tabs { padding: 0; margin: -4px 0 20px; }
.auth-foot { text-align: center; margin-top: 18px; font-size: 13.5px; color: var(--muted); }
.form-err { background: var(--danger-soft); color: var(--danger); padding: 10px 12px; border-radius: var(--r-sm); font-size: 13.5px; font-weight: 600; margin-bottom: 14px; }
.staff-auth { min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--bg); }
.staff-auth .card { width: min(100%, 400px); padding: 28px; }

/* =====================================================================
   ADMIN
   ===================================================================== */
.a-shell { display: grid; grid-template-columns: 252px 1fr; min-height: 100dvh; background: var(--bg); }
.a-side { position: sticky; top: 0; height: 100dvh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding: 18px 14px; display: flex; flex-direction: column; }
.a-brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.a-brand b { font-size: 16px; letter-spacing: -0.02em; display: block; }
.a-brand small { color: var(--muted); font-size: 12px; }
.a-nav { display: grid; gap: 2px; }
.a-nav .grp { font-size: 12px; font-weight: 650; color: var(--faint); padding: 16px 12px 6px; }
.a-nav a { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: var(--r-sm); color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14.5px; }
.a-nav a:hover { background: var(--sunken); color: var(--text); }
.a-nav a[aria-current=page] { background: var(--primary-soft); color: var(--primary); }
.a-nav .count { margin-left: auto; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 800; display: grid; place-items: center; }
.a-user { margin-top: auto; padding: 12px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.a-user .avatar { width: 36px; height: 36px; font-size: 14px; }
.a-user b { font-size: 14px; display: block; }
.a-user small { font-size: 12px; color: var(--muted); }
.a-main { min-width: 0; padding: 24px 32px 60px; }
.a-head { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
.a-head h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.025em; }
.a-head p { color: var(--muted); font-size: 14px; margin-top: 2px; }
.a-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.a-mobilebar { display: none; }
@media (max-width: 960px) {
  .a-shell { grid-template-columns: 1fr; }
  .a-side { position: fixed; left: 0; top: 0; z-index: 120; width: 272px; transform: translateX(-100%); transition: transform .25s var(--ease); box-shadow: 20px 0 60px -20px rgba(0,0,0,.3); }
  .a-shell.nav-open .a-side { transform: none; }
  .a-shell.nav-open::after { content: ''; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 110; }
  .a-mobilebar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 60; }
  .a-main { padding: 18px 16px 60px; }
}

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 18px; }
.kpi { padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
.kpi .lbl { font-size: 13px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 7px; }
.kpi .val { font-size: 26px; font-weight: 800; letter-spacing: -0.025em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 12.5px; color: var(--faint); margin-top: 2px; }
.kpi.hero { background: var(--primary); color: var(--on-primary); border-color: transparent; }
.kpi.hero .lbl, .kpi.hero .sub { color: color-mix(in srgb, var(--on-primary) 72%, transparent); }
.grid-2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; }
.grid-2e { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 1100px) { .grid-2, .grid-2e { grid-template-columns: 1fr; } }
.card-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 0; }
.card-head h3 { font-size: 15.5px; font-weight: 750; }
.card-head .spacer + * { margin-left: auto; }

.chart { padding: 10px 18px 16px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .bar { fill: var(--primary); }
.chart .bar.today { fill: var(--accent); }
.chart .bar:hover { opacity: .8; }
.chart text { font-size: 10.5px; fill: var(--faint); font-family: var(--font); }
.chart .grid { stroke: var(--line); }
.hbar { display: grid; gap: 12px; padding: 16px 18px 18px; }
.hbar-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13.5px; }
.hbar-row .t { height: 8px; border-radius: 99px; background: var(--sunken); grid-column: 1 / -1; overflow: hidden; }
.hbar-row .t i { display: block; height: 100%; border-radius: 99px; background: var(--hc, var(--primary)); }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar .input-icon { flex: 1; min-width: 220px; max-width: 380px; }
.toolbar select { width: auto; min-width: 140px; }
.tbl-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-weight: 650; font-size: 12.5px; color: var(--muted); padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--sunken); position: sticky; top: 0; }
.tbl th button { font-weight: 650; display: inline-flex; gap: 3px; align-items: center; color: inherit; }
.tbl td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr.click { cursor: pointer; }
.tbl tbody tr.click:hover td { background: color-mix(in srgb, var(--primary) 3%, var(--surface)); }
.tbl .nw { white-space: nowrap; }
.tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .who b { display: block; font-weight: 650; }
.tbl .who small { color: var(--muted); font-size: 12.5px; }
.tbl tr.void td { color: var(--faint); text-decoration: line-through; }

/* Drawer detail customer */
.sheet.drawer { max-width: 560px; }
@media (min-width: 720px) {
  .sheet-backdrop:has(.drawer) { justify-content: flex-end; align-items: stretch; padding: 0; }
  .sheet.drawer { height: 100dvh; max-height: none; border-radius: 0; transform: translateX(30px); }
}
.d-hero { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; }
.d-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.d-stats > div { padding: 12px; border-radius: var(--r-sm); background: var(--sunken); }
.d-stats small { color: var(--muted); font-size: 12px; font-weight: 600; display: block; }
.d-stats b { font-size: 16px; font-variant-numeric: tabular-nums; }
.code-box { text-align: center; padding: 18px; border-radius: var(--r-md); background: var(--primary-soft); margin: 6px 0 14px; }
.code-box b { font-size: 30px; letter-spacing: .12em; font-variant-numeric: tabular-nums; color: var(--primary); }

/* Kasir (POS) */
.pos { display: grid; grid-template-columns: 1fr 380px; gap: 18px; align-items: start; }
@media (max-width: 1100px) { .pos { grid-template-columns: 1fr; } }
.pos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.pos-item { display: grid; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; transition: border-color .15s, transform .1s; position: relative; }
.pos-item:hover { border-color: var(--primary); }
.pos-item:active { transform: scale(.98); }
.pos-item .thumb { aspect-ratio: 16/10; position: relative; }
.pos-item .info { padding: 8px 10px 10px; }
.pos-item b { font-size: 13.5px; font-weight: 650; display: block; line-height: 1.3; }
.pos-item span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pos-item .q { position: absolute; top: 6px; right: 6px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 99px; background: var(--primary); color: var(--on-primary); font-weight: 800; font-size: 12.5px; display: grid; place-items: center; }
.ticket { position: sticky; top: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); display: flex; flex-direction: column; max-height: calc(100dvh - 40px); }
.ticket-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.ticket-body { padding: 4px 18px; overflow-y: auto; flex: 1; min-height: 120px; }
.ticket-foot { padding: 14px 18px 18px; border-top: 1px solid var(--line); }
.cust-pick { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--sunken); }
.cust-pick .who { flex: 1; min-width: 0; }
.cust-pick b { display: block; font-size: 14px; }
.cust-pick small { font-size: 12.5px; color: var(--muted); }
.t-line { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; }
.t-line b { font-size: 14px; font-weight: 650; }
.t-line small { color: var(--muted); font-variant-numeric: tabular-nums; }
.t-line .qty button { width: 28px; height: 28px; }
.pick-list { display: grid; max-height: 50vh; overflow-y: auto; margin-top: 8px; }
.pick-list button { display: flex; align-items: center; gap: 12px; padding: 11px 6px; border-bottom: 1px solid var(--line); text-align: left; }
.pick-list button:hover { background: var(--sunken); }

/* Pesanan masuk (kanban) */
.kanban { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-items: start; }
@media (max-width: 1100px) { .kanban { grid-template-columns: 1fr; } }
.kcol { background: var(--sunken); border-radius: var(--r-md); padding: 12px; min-height: 160px; }
.kcol > h3 { font-size: 14px; font-weight: 750; padding: 4px 6px 10px; display: flex; gap: 8px; align-items: center; }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 14px; }
.kcard + .kcard { margin-top: 10px; }
.kcard ul { margin: 8px 0; padding: 0; list-style: none; font-size: 13.5px; }
.kcard li { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }

/* Menu admin */
.adm-menu .thumb { width: 44px; height: 44px; border-radius: 10px; overflow: hidden; }
.img-pick { display: flex; gap: 14px; align-items: center; }
.img-pick .thumb { width: 84px; height: 84px; border-radius: var(--r-sm); overflow: hidden; border: 1px solid var(--line); flex: none; }

/* Builder tampilan */
.builder { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 24px; align-items: start; }
@media (max-width: 1200px) { .builder { grid-template-columns: 1fr; } .builder .preview-col { order: -1; } }
.builder section { margin-bottom: 16px; }
.builder section > .card-head { padding-bottom: 4px; }

  tierBasis: 'lifetime', // 'lifetime' | 'rolling365'
  voucherValidDays: 30,
  tiers: [
    { key: 'reguler', name: 'Reguler', minSpend: 0, multiplier: 1, color: '#8A8F9C', benefits: ['1 poin setiap Rp10.000', 'Akses katalog rewards'] },
    { key: 'silver', name: 'Silver', minSpend: 500000, multiplier: 1, color: '#9BA7B4', benefits: ['Semua benefit Reguler', 'Rewards khusus Silver'] },
    { key: 'gold', name: 'Gold', minSpend: 1500000, multiplier: 1, color: '#C9A227', benefits: ['Semua benefit Silver', 'Rewards khusus Gold', 'Prioritas promo'] },
  ],

function sortedTiers(tiers) {
  return [...(tiers || [])].sort((a, b) => a.minSpend - b.minSpend);

function tierFor(spend, tiers) {

  let current = list[0] || { key: 'reguler', name: 'Reguler', minSpend: 0, multiplier: 1 };
  for (const t of list) if (spend >= t.minSpend) current = t;

function pointsForPurchase(spendBefore, amount, loyalty, tierAtPurchase) {
  const rate = Math.max(1, Number(loyalty.rupiahPerPoint) || 10000);
  const base = Math.floor((spendBefore + amount) / rate) - Math.floor(spendBefore / rate);
  const mult = Number(tierAtPurchase?.multiplier) || 1;

    ${preview ? '' : html`<div class="mcard-actions"><button data-act="pass">${icon('scan', 17)} Kode member</button><button data-go="#/rewards">${icon('gift', 17)} Tukar poin</button></div>`}
  </section>`;
}

function catKeyOf(cfg, item) { return cfg.categories.find((c) => c.id === item.categoryId)?.key || ''; }
const tempTag = (t) => (t === 'hot' ? html`<span class="temp-tag temp-hot">Panas</span>` : t === 'cold' ? html`<span class="temp-tag temp-cold">Dingin</span>` : '');

function productCard(cfg, m) {
  return html`<button class="pcard" data-item="${m.id}">
    <div class="thumb">${menuThumb(m, catKeyOf(cfg, m))}${m.available ? html`<span class="add add-btn" aria-hidden="true">${icon('plus', 18)}</span>` : html`<span class="soldout">Habis</span>`}</div>
    <h5>${m.name}</h5><div class="price">${rupiah(m.price)}</div></button>`;
}

const SECTION = {
  member: (st) => memberCard(st.me, st.config, { preview: st.preview }),
  actions: (st) => html`<nav class="quick" aria-label="Aksi cepat">
      <button data-go="#/menu"><span class="qi">${icon('cup')}</span>Pesan</button>
      <button data-act="pass"><span class="qi">${icon('scan')}</span>Kode member</button>
      <button data-go="#/rewards"><span class="qi">${icon('gift')}</span>Rewards${st.me?.activeVouchers ? html`<span class="dot">${st.me.activeVouchers}</span>` : ''}</button>
      <button data-go="#/orders"><span class="qi">${icon('receipt')}</span>Pesanan${st.me?.activeOrders?.length ? html`<span class="dot">${st.me.activeOrders.length}</span>` : ''}</button></nav>`,
  banners: (st) => {
    const list = (st.config.appearance.banners || []).filter((b) => b.active);
    if (!list.length) return '';
    return html`<div class="c-section"><div class="hscroll">${list.map((b) => html`<article class="banner ${b.image ? 'has-img' : ''}" style="--bc:${b.color}">
      ${b.image ? html`<img src="${b.image}" alt="">` : raw(ringsSvg('#fff').toString().replace('class="rings"', 'class="ring-deco"'))}
      <div><h4>${b.title}</h4>${b.subtitle ? html`<p>${b.subtitle}</p>` : ''}</div></article>`)}</div></div>`;
  },
  featured: (st) => {
    const items = st.config.menu.filter((m) => m.featured).slice(0, 10);
    if (!items.length) return '';
    return html`<div class="c-section"><div class="c-section-head"><h3>Pilihan barista</h3><a class="link" href="#/menu">Semua menu ${icon('right', 16)}</a></div>
      <div class="hscroll">${items.map((m) => productCard(st.config, m))}</div></div>`;
  },
  categories: (st) => {
    const cats = st.config.categories.filter((c) => st.config.menu.some((m) => m.categoryId === c.id));
    if (!cats.length) return '';
    return html`<div class="c-section"><div class="c-section-head"><h3>Kategori</h3></div><div class="cat-tiles">${cats.slice(0, 8).map((c) => {
      const sample = st.config.menu.find((m) => m.categoryId === c.id);
      return html`<button data-go="#/menu?c=${c.key}"><span class="ct">${menuThumb(sample, c.key)}</span>${c.name}</button>`;
    })}</div></div>`;
  },
  rewards: (st) => {
    const list = st.config.rewards.slice(0, 6);
    if (!list.length) return '';
    return html`<div class="c-section"><div class="c-section-head"><h3>Tukar poin</h3><a class="link" href="#/rewards">Lihat semua ${icon('right', 16)}</a></div>
      <div class="hscroll">${list.map((r) => html`<button class="rw-mini" data-go="#/rewards"><span class="pts">${icon('coin', 16)} ${num(r.pointsCost)} poin</span><h5>${r.name}</h5><span class="small muted">${r.description || ''}</span></button>`)}</div></div>`;
  },
};

function activeOrderStrip(st) {
  const o = st.me?.activeOrders?.[0];
  if (!o || st.preview) return '';
  return html`<div class="c-section"><button class="order-card" style="width:100%;text-align:left" data-go="#/orders">
    <div class="row"><span class="badge badge-primary badge-dot">${ORDER_LABEL[o.status]}</span><span class="spacer"></span><span class="small muted">Antrean</span><b class="tnum">A-${String(o.queueNo).padStart(2, '0')}</b></div>
    ${orderSteps(o)}</button></div>`;
}

function homeView(st) {
  const app = st.config.appearance;
  const sections = app.homeSections.filter((s) => s.visible && SECTION[s.key]);
  return html`<header class="c-top">${logoEl(app)}<div><div class="brand">${app.brandName}</div>
      <div class="hello">${st.me ? `${greeting()}, ${firstName(st.me.name)}` : app.tagline}</div></div>
      <span class="spacer"></span>${st.me ? html`<button class="icon-btn" data-act="pass" aria-label="Kode member">${icon('scan', 22)}</button>` : html`<a class="btn btn-sm btn-soft" href="#/login">Masuk</a>`}</header>
    ${app.announcement ? html`<div class="announce">${icon('bell', 17)} ${app.announcement}</div>` : ''}
    ${sections.map((s, i) => html`${SECTION[s.key](st)}${s.key === 'member' || (i === 0 && !sections.some((x) => x.key === 'member')) ? activeOrderStrip(st) : ''}`)}
    <div style="height:12px"></div>`;
}

function menuView(st) {
      const cfg = st.config;
      const layout = cfg.appearance.menuLayout || 'list';
      const q = (st.menuSearch || '').toLowerCase();
      const cats = cfg.categories.map((c) => ({ ...c, items: cfg.menu.filter((m) => m.categoryId === c.id && (!q || m.name.toLowerCase().includes(q))) })).filter((c) => c.items.length);
      const itemEl = (m, catKey) => {
        const add = m.available ? html`<span class="add-btn" aria-hidden="true">${icon('plus', 18)}</span>` : '';
        if (layout === 'list') return html`<button class="m-item" data-item="${m.id}"><div class="thumb">${menuThumb(m, catKey)}${m.available ? '' : html`<span class="soldout">Habis</span>`}</div>
          <div class="info"><h4>${m.name}${tempTag(m.temp)}</h4>${m.description ? html`<p class="desc">${m.description}</p>` : ''}<div class="price">${rupiah(m.price)}</div></div>${add}</button>`;
        return html`<button class="m-item" data-item="${m.id}"><div class="thumb">${menuThumb(m, catKey)}${m.available ? '' : html`<span class="soldout">Habis</span>`}</div>
          <div class="info"><h4>${m.name}${tempTag(m.temp)}</h4>${layout === 'large' && m.description ? html`<p class="desc">${m.description}</p>` : ''}<div class="row"><span class="price">${rupiah(m.price)}</span>${add}</div></div></button>`;
      };
      return html`<div class="c-pagehead"><h1>Menu</h1>
        <label class="input-icon">${icon('search', 18)}<span class="sr-only">Cari menu</span><input type="search" id="menu-q" placeholder="Cari kopi, teh, makanan" value="${st.menuSearch || ''}" autocomplete="off"></label>
        <div class="chips" role="group" aria-label="Kategori">${cats.map((c, i) => html`<button class="chip" data-cat="${c.key}" aria-pressed="${i === 0}">${c.name}</button>`)}</div></div>
        ${cats.length ? cats.map((c) => html`<section class="m-cat" id="cat-${c.key}"><h3>${c.name}</h3><div class="m-${layout}">${c.items.map((m) => itemEl(m, c.key))}</div></section>`)
          : html`<div class="empty">${icon('search')}<h4>Menu tidak ditemukan</h4><p>Coba kata lain, misalnya "latte".</p></div>`}`;
    }

function orderSteps(o) {
  const idx = ORDER_STEPS.indexOf(o.status);
  return html`<div class="steps">${ORDER_STEPS.map((s, i) => html`<div class="${i <= idx ? 'on' : ''}"></div>`)}</div>
    <div class="steps-label">${ORDER_STEPS.map((s, i) => html`<span class="${i <= idx ? 'on' : ''}">${ORDER_LABEL[s]}</span>`)}</div>`;
}

// ======================================================================
// Aplikasi customer
// ======================================================================
function createCustomerApp(root, store) {
  const st = store.state;
  let pollTimer = null;
  let lastStatuses = new Map();

  const cart = {
    load() { try { return JSON.parse(localStorage.getItem('lacafe_cart') || '[]').filter((l) => Number.isInteger(l.menuItemId) && l.qty > 0); } catch { return []; } },
    save() { try { localStorage.setItem('lacafe_cart', JSON.stringify(st.cart)); } catch {} },
    count() { return st.cart.reduce((s, l) => s + l.qty, 0); },
    lines() { return st.cart.map((l) => ({ ...l, item: st.config.menu.find((m) => m.id === l.menuItemId) })).filter((l) => l.item); },
    subtotal() { return this.lines().reduce((s, l) => s + l.item.price * l.qty, 0); },
    add(menuItemId, qty, note) {
      const ex = st.cart.find((l) => l.menuItemId === menuItemId && (l.note || '') === (note || ''));
      if (ex) ex.qty = Math.min(50, ex.qty + qty); else st.cart.push({ menuItemId, qty, note: note || '' });
      this.save();
    },
  };
  st.cart = cart.load();

  async function refreshMe() {
    if (!st.session?.kind) { st.me = null; return; }
    try { st.me = await get('/api/me'); } catch (e) { if (e.status === 401) { st.session = { kind: null }; st.me = null; } }
    for (const o of st.me?.activeOrders || []) {
      const prev = lastStatuses.get(o.id);
      if (prev && prev !== o.status && o.status === 'ready') toast(`Pesanan A-${String(o.queueNo).padStart(2, '0')} siap diambil`, 'ok');
      lastStatuses.set(o.id, o.status);
    }
  }

  function startPolling() {
    clearInterval(pollTimer);
    pollTimer = setInterval(async () => {
      if (document.hidden || !st.me?.activeOrders?.length) return;
      await refreshMe();
      if (['', '/', '/orders'].includes(currentPath())) render();
    }, 15000);
  }

  const currentPath = () => (location.hash.slice(1).split('?')[0] || '/');
  const query = () => new URLSearchParams(location.hash.split('?')[1] || '');

  // ---------------- Layout ----------------
  function shell(content, active) {
    const n = cart.count();
    const tabs = [['/', 'home', 'Beranda'], ['/menu', 'cup', 'Menu'], ['/rewards', 'gift', 'Rewards'], ['/orders', 'receipt', 'Pesanan'], ['/account', 'user', 'Akun']];
    return html`<div class="c-shell"><div class="c-app" id="c-app">${content}
      ${n && active !== '/auth' ? html`<div class="cartbar"><div><div class="cnt">${n} item di keranjang</div><b class="tnum">${rupiah(cart.subtotal())}</b></div><span class="spacer"></span><button class="btn" data-act="cart">${icon('bag', 18)} Keranjang</button></div>` : ''}
      ${active === '/auth' ? '' : html`<nav class="bnav" aria-label="Navigasi utama">${tabs.map(([p, ic, l]) => html`<a href="#${p}" ${active === p ? raw('aria-current="page"') : ''}>${icon(ic, 22)}${l}${p === '/orders' && st.me?.activeOrders?.length ? html`<span class="dot"></span>` : ''}</a>`)}</nav>`}
    </div></div>`;
  }

  function needLogin(title) {
    return html`<div class="c-pagehead"><h1>${title}</h1></div><div class="c-section"><div class="card pad empty">${icon('user')}
      <h4>Masuk untuk melanjutkan</h4><p>Lihat poin, tukar rewards, dan lacak pesanan dengan akun member.</p>
      <div class="row" style="justify-content:center;margin-top:16px"><a class="btn btn-primary" href="#/login">Masuk</a><a class="btn btn-ghost" href="#/register">Daftar</a></div></div></div>`;
  }

  // ---------------- Halaman ----------------
  const pages = {
    '/': () => homeView(st),

    '/menu': () => menuView(st),

    '/rewards': () => {
      if (!st.me) return needLogin('Rewards');
      const tab = st.rewardTab || 'katalog';
      const s = st.me.stats;
      const tiers = sortedTiers(st.config.loyalty.tiers);
      const rank = (k) => tiers.findIndex((t) => t.key === k);
      return html`<div class="c-pagehead"><h1>Rewards</h1></div>
        <div class="pts-hero"><span class="coin">${icon('coin', 26)}</span><div><div class="small muted">Poin kamu</div><b>${num(s.points)}</b></div><span class="spacer"></span>
          <span class="tier-chip" style="--tc:${s.tier.color}"><i></i>${s.tier.name}</span></div>
        <div class="tabs" role="tablist"><button role="tab" data-rtab="katalog" aria-selected="${tab === 'katalog'}">Tukar poin</button><button role="tab" data-rtab="voucher" aria-selected="${tab === 'voucher'}">Voucher saya${st.me.activeVouchers ? ` (${st.me.activeVouchers})` : ''}</button></div>
        <div class="c-section" style="margin-top:16px">${tab === 'katalog'
          ? (st.config.rewards.length ? html`<div class="rw-list">${st.config.rewards.map((r) => {
            const tierLock = r.minTier && rank(s.tier.key) < rank(r.minTier);
            const short = r.pointsCost - s.points;
            const soldOut = r.stock !== null && r.stock <= 0;
            const reason = soldOut ? 'Stok habis' : tierLock ? `Khusus ${tiers.find((t) => t.key === r.minTier)?.name || r.minTier} ke atas` : short > 0 ? `Kurang ${num(short)} poin` : '';
            const item = r.menuItemId && st.config.menu.find((m) => m.id === r.menuItemId);
            return html`<article class="rw ${reason ? 'locked' : ''}"><div class="thumb">${item ? menuThumb(item, catKeyOf(st.config, item)) : icon(r.type === 'discount_percent' ? 'ticket' : 'gift', 28)}</div>
              <div class="info"><h4>${r.name}</h4><div class="meta">${r.description || ''}${r.stock !== null && !soldOut ? ` Sisa ${r.stock}.` : ''}</div><div class="cost">${icon('coin', 15)} ${num(r.pointsCost)} poin</div></div>
              ${reason ? html`<span class="small muted" style="max-width:90px;text-align:right">${reason}</span>` : html`<button class="btn btn-sm btn-primary" data-redeem="${r.id}">Tukar</button>`}</article>`;
          })}</div>` : html`<div class="empty">${icon('gift')}<h4>Belum ada reward</h4><p>Reward akan muncul di sini.</p></div>`)
          : html`<div id="vouchers"><div class="skeleton" style="height:80px"></div></div>`}</div>`;
    },

    '/orders': () => {
      if (!st.me) return needLogin('Pesanan');
      const tab = st.orderTab || 'berjalan';
      return html`<div class="c-pagehead"><h1>Pesanan</h1></div>
        <div class="tabs" role="tablist" style="margin-top:0"><button role="tab" data-otab="berjalan" aria-selected="${tab === 'berjalan'}">Berjalan</button><button role="tab" data-otab="riwayat" aria-selected="${tab === 'riwayat'}">Riwayat belanja</button></div>
        <div class="c-section" style="margin-top:16px">${tab === 'berjalan'
          ? (st.me.activeOrders.length ? st.me.activeOrders.map((o) => html`<article class="order-card">
              <div class="row"><div><div class="small muted">Nomor antrean</div><div class="queue">A-${String(o.queueNo).padStart(2, '0')}</div></div><span class="spacer"></span><span class="badge badge-primary badge-dot">${ORDER_LABEL[o.status]}</span></div>
              ${orderSteps(o)}
              <div class="divider"></div>
              ${o.items.map((i) => html`<div class="kv"><span>${i.qty}x ${i.name}</span><span class="tnum">${rupiah(i.lineTotal)}</span></div>`)}
              ${o.discount ? html`<div class="kv"><span>Voucher</span><span class="tnum plus">-${rupiah(o.discount)}</span></div>` : ''}
              <div class="kv total"><span>Total</span><span class="tnum">${rupiah(o.total)}</span></div>
              <p class="small muted" style="margin-top:8px">${o.status === 'ready' ? st.config.appearance.pickupNote : `Bayar di kasir (${o.paymentMethod}). Poin masuk setelah pesanan selesai.`}</p>
              ${o.status === 'pending' ? html`<button class="btn btn-sm btn-danger-ghost btn-ghost" style="margin-top:12px" data-cancel="${o.id}">Batalkan pesanan</button>` : ''}
            </article>`) : html`<div class="empty">${icon('bag')}<h4>Tidak ada pesanan berjalan</h4><p>Pesan dari menu, ambil di kasir tanpa antre lama.</p><a class="btn btn-primary" style="margin-top:14px" href="#/menu">Lihat menu</a></div>`)
          : html`<div id="history"><div class="skeleton" style="height:60px;margin-bottom:8px"></div><div class="skeleton" style="height:60px"></div></div>`}</div>`;
    },

    '/account': () => {
      if (!st.me) return needLogin('Akun');
      const s = st.me.stats;
      const tiers = sortedTiers(st.config.loyalty.tiers);
      return html`<div class="acct-head"><span class="avatar">${(st.me.name || '?').charAt(0).toUpperCase()}</span><div><h2 style="font-size:20px">${st.me.name}</h2>
        <div class="small muted">${st.me.memberCode}${st.me.phone ? ` / ${st.me.phone}` : ''}</div></div></div>
        <div class="c-section" style="margin-top:14px"><div class="d-stats">
          <div><small>Kunjungan</small><b>${num(s.visits)}x</b></div><div><small>Total belanja</small><b>${rupiah(s.totalSpend)}</b></div><div><small>Status</small><b style="font-size:14px">${STATUS_LABEL[s.status]}</b></div></div></div>
        <div class="c-section" style="margin-top:8px"><div class="c-section-head"><h3>Level member</h3></div>
          <div class="ladder">${tiers.map((t) => html`<div class="ladder-step ${t.key === s.tier.key ? 'current' : ''}" style="--tc:${t.color}"><span class="medal"></span>
            <div style="flex:1"><div class="row"><b>${t.name}</b><span class="spacer"></span><span class="small muted">${t.minSpend ? `Belanja ${rupiah(t.minSpend)}` : 'Mulai dari daftar'}</span></div>
            ${t.benefits?.length ? html`<ul>${t.benefits.map((b) => html`<li>${b}</li>`)}</ul>` : ''}</div></div>`)}</div>
          <p class="small muted" style="margin-top:10px">${st.config.loyalty.tierBasis === 'rolling365' ? 'Level dihitung dari total belanja 12 bulan terakhir.' : 'Level dihitung dari total belanja sejak menjadi member.'} 1 poin untuk setiap ${rupiah(st.config.loyalty.rupiahPerPoint)}.</p></div>
        <div class="c-section"><div class="menu-list">
          <button data-act="ledger">${icon('history')} Riwayat poin ${icon('right', 18)}</button>
          <button data-act="profile">${icon('edit')} Ubah profil ${icon('right', 18)}</button>
          <button data-act="password">${icon('key')} Ganti kata sandi ${icon('right', 18)}</button>
          <button data-act="logout" style="color:var(--danger)">${icon('logout')} Keluar</button></div></div>`;
    },

    '/login': () => authView('login'),
    '/register': () => authView('register'),
    '/activate': () => authView('activate'),
  };

  function authView(mode) {
    const app = st.config.appearance;
    const pw = (name, label, auto = 'current-password') => html`<label class="field"><span>${label}</span><div class="pw-wrap"><input type="password" name="${name}" required autocomplete="${auto}" minlength="${mode === 'login' ? 1 : 8}"><button type="button" class="icon-btn" data-act="pw-toggle" aria-label="Tampilkan kata sandi">${icon('eye', 18)}</button></div>${mode !== 'login' ? html`<small>Minimal 8 karakter, berisi huruf dan angka</small>` : ''}</label>`;
    const forms = {
      login: html`<form data-form="login" novalidate>
        <label class="field"><span>Nomor WhatsApp atau ID member</span><input name="identifier" required autocomplete="username" placeholder="0812xxxxxxx atau LC001" inputmode="text"></label>
        ${pw('password', 'Kata sandi')}<div class="form-err hide"></div><button class="btn btn-primary btn-block">Masuk</button></form>`,
      register: html`<form data-form="register" novalidate>
        <label class="field"><span>Nama lengkap</span><input name="name" required autocomplete="name" maxlength="60"></label>
        <label class="field"><span>Nomor WhatsApp</span><input name="phone" required autocomplete="tel" inputmode="tel" placeholder="0812xxxxxxx"></label>
        <div class="row-2"><label class="field"><span>Gender</span><select name="gender"><option value="">Pilih</option>${st.config.options.genders.map((g) => html`<option>${g}</option>`)}</select></label>
        <label class="field"><span>Tanggal lahir</span><input type="date" name="birthday"></label></div>
        ${pw('password', 'Buat kata sandi', 'new-password')}<div class="form-err hide"></div><button class="btn btn-primary btn-block">Daftar jadi member</button></form>`,
      activate: html`<form data-form="activate" novalidate><div class="notice">${icon('shield', 18)}<span>Sudah pernah belanja dan tercatat di kasir? Minta <b>kode aktivasi</b> ke kasir, lalu buat kata sandi di sini. Poin lama Anda tetap aman.</span></div>
        <label class="field"><span>Nomor WhatsApp atau ID member</span><input name="identifier" required placeholder="0812xxxxxxx atau LC001"></label>
        <label class="field"><span>Kode aktivasi dari kasir</span><input name="code" required placeholder="XXXX-XXXX" autocomplete="one-time-code" style="text-transform:uppercase;letter-spacing:.1em"></label>
        ${pw('password', 'Buat kata sandi', 'new-password')}<div class="form-err hide"></div><button class="btn btn-primary btn-block">Aktifkan akun</button></form>`,
    };
    return html`<div class="auth"><div class="auth-hero">${ringsSvg()}<div class="row">${logoEl(app)}<b>${app.brandName}</b><span class="spacer"></span><a class="btn btn-sm" style="background:color-mix(in srgb,var(--on-primary) 14%,transparent);color:inherit" href="#/">Lihat menu</a></div>
      <h1>${mode === 'register' ? 'Jadi member, kumpulkan poin' : mode === 'activate' ? 'Aktifkan akun member' : 'Selamat datang kembali'}</h1><p>${app.tagline}</p></div>
      <div class="auth-card"><div class="tabs" role="tablist"><button role="tab" data-go="#/login" aria-selected="${mode === 'login'}">Masuk</button><button role="tab" data-go="#/register" aria-selected="${mode === 'register'}">Daftar</button><button role="tab" data-go="#/activate" aria-selected="${mode === 'activate'}">Aktifkan akun</button></div>
      ${forms[mode]}</div>
      <p class="auth-foot">Staf toko? <a class="link" href="#/admin">Masuk ke panel admin</a></p></div>`;
  }

  // ---------------- Render ----------------
  async function render() {
    const path = currentPath();
    const view = pages[path] || pages['/'];
    const isAuth = ['/login', '/register', '/activate'].includes(path);
    if (isAuth && st.me) { location.hash = '#/'; return; }
    const scrollY = window.scrollY;
    mount(root, shell(view(), isAuth ? '/auth' : path));
    if (path === st.lastPath) window.scrollTo(0, scrollY); else window.scrollTo(0, 0);
    st.lastPath = path;
    if (path === '/menu') afterMenu();
    if (path === '/rewards' && st.me && (st.rewardTab || 'katalog') === 'voucher') loadVouchers();
    if (path === '/orders' && st.me && st.orderTab === 'riwayat') loadHistory();
  }

  function afterMenu() {
    const c = query().get('c');
    if (c) setTimeout(() => document.getElementById('cat-' + c)?.scrollIntoView({ behavior: 'smooth' }), 50);
    const input = $('#menu-q', root);
    input?.addEventListener('input', () => {
      st.menuSearch = input.value;
      const pos = input.selectionStart;
      render().then(() => { const i = $('#menu-q', root); i.focus(); i.setSelectionRange(pos, pos); });
